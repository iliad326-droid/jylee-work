<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>타이어 재고 조회</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#eceff1;--sf:#fff;--ink:#12202b;--mute:#5b6b78;--line:#d5dce1;--ac:#0a6c8f;--aci:#fff;--chip:#e1e8ec;--bad:#b4410f;--ok:#1f7a4d;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161b;--sf:#172028;--ink:#e6edf1;--mute:#93a3ae;--line:#2a3741;--ac:#4cb7dc;--aci:#06222d;--chip:#223039;--bad:#ff9b6b;--ok:#6fd5a0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f161b;--sf:#172028;--ink:#e6edf1;--mute:#93a3ae;--line:#2a3741;--ac:#4cb7dc;--aci:#06222d;--chip:#223039;--bad:#ff9b6b;--ok:#6fd5a0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.src{color:var(--mute);font-size:13px;margin-top:2px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--sf);color:var(--ink);padding:8px 14px}
button.pri{background:var(--ac);color:var(--aci);border-color:var(--ac);font-weight:500}
button:focus-visible,input:focus-visible,.chip:focus-visible,th[data-k]:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.search{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:6px 18px;display:flex;align-items:center;gap:12px}
.search input{flex:1;border:0;background:none;color:var(--ink);font:500 26px/1.6 "IBM Plex Sans KR",system-ui,sans-serif;letter-spacing:.01em;min-width:0;outline:none}
.search input::placeholder{color:var(--mute);font-weight:400;font-size:18px}
.search:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
.clr{border:0;background:none;color:var(--mute);padding:4px 8px}
.filters{display:flex;flex-wrap:wrap;gap:8px 20px;margin:14px 0}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.frow b{font-weight:500;color:var(--mute);width:60px;font-size:13px}
select{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:240px;max-width:100%}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:3px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ac);color:var(--aci);border-color:var(--ac)}
.chip i{font-style:normal;opacity:.65;margin-left:4px}
.bar{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 8px;color:var(--mute);font-size:13px}
.tw{background:var(--sf);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:1000px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--mute);font-size:13px;background:var(--sf);position:sticky;top:0}
th[data-k]{cursor:pointer;user-select:none}
td.r,th.r{text-align:right}
tr.row{cursor:pointer}
tr.row:hover td{background:color-mix(in srgb,var(--ac) 7%,var(--sf))}
.dim{font-weight:700;font-size:16px}
td.w{white-space:normal;min-width:180px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--mute)}
.tag.rft{color:var(--ac);border-color:var(--ac)}
tr.det td{background:var(--bg);white-space:normal;padding:12px 14px}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px 18px;margin:0}
.dl div{display:flex;flex-direction:column}.dl dt{font-size:12px;color:var(--mute)}.dl dd{margin:0;word-break:break-all}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}
.more{display:block;margin:14px auto 0}
dialog{width:min(640px,calc(100vw - 24px));border:1px solid var(--line);border-radius:14px;background:var(--sf);color:var(--ink);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 4px;font-size:18px}
.drop{margin:14px 0;border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--mute)}
.drop.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 8%,transparent)}
.rep{font-size:14px;margin:10px 0}.rep .bad{color:var(--bad)}.rep .ok{color:var(--ok)}
.rep ul{margin:6px 0 0;padding-left:18px;color:var(--mute);font-size:13px}
.mode{display:flex;gap:16px;margin:10px 0;flex-wrap:wrap}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#gate[hidden]{display:none}
.gbox{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:24px;width:min(380px,100%);display:grid;gap:12px}
.gbox h2{margin:0;font-size:18px}
.gbox label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.gbox label[hidden]{display:none}
.gbox input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.gerr{color:var(--bad);font-size:13px;min-height:18px}
.locked .wrap{display:none}
@media (max-width:600px){.search input{font-size:20px}h1{font-size:19px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div><h1>타이어 재고 조회</h1><div class="src" id="src"></div></div>
<div class="frow"><button id="auth" hidden>접속 계정 설정</button><button id="reset" hidden>기본 데이터로 복원</button><button class="pri" id="up">엑셀 업로드</button></div>
</header>
<label class="search"><input id="q" type="search" autocomplete="off" placeholder="규격(225/45R17), 브랜드, 제품명, 파트번호" aria-label="타이어 검색"><button class="clr" id="clr" hidden type="button" aria-label="검색어 지우기">지우기</button></label>
<div class="filters">
<label class="frow"><b>브랜드</b><select id="fb" aria-label="브랜드 필터"></select></label>
<label class="frow"><b>RFT/STD</b><select id="ft" aria-label="RFT/STD 필터"></select></label>
</div>
<div class="bar"><span id="cnt"></span><span>부품을 누르면 원래 장착 타이어, Model Series, OE Marking이 열립니다</span></div>
<div class="tw"><table><thead><tr id="hd"></tr></thead><tbody id="tb"></tbody></table><div id="none" class="empty" hidden>조건에 맞는 타이어가 없습니다. 검색어를 줄이거나 필터를 해제해 보세요.</div></div>
<button class="more" id="more" hidden>더 보기</button>
</div>

<dialog id="dlg">
<h2>엑셀 업로드</h2>
<div class="hint">첫 번째 시트를 읽습니다. 필수 열: 파트번호, 브랜드, 사이즈, 부가세 포함 (VAT포함). 선택 열: OE/RE, Mat., 부품명, RFT/STD, W/S, OE Marking, 원래 장착되어 있던 타이어, Model Series, 수량(재고).</div>
<div class="drop" id="drop">파일을 여기에 끌어놓거나 <button id="pick" type="button">파일 선택</button><input id="file" type="file" accept=".xlsx,.xls,.csv" hidden></div>
<div id="rep" class="rep" aria-live="polite"></div>
<div class="mode" id="mode" hidden>
<label><input type="radio" name="m" value="replace" checked> 전체 교체 (기존 데이터를 지우고 새로 등록)</label>
<label><input type="radio" name="m" value="merge"> 파트번호 기준 병합 (있으면 덮어쓰고, 없으면 추가)</label>
</div>
<div class="acts"><button id="cancel" type="button">닫기</button><button class="pri" id="apply" type="button" disabled>데이터 반영</button></div>
</dialog>
<div id="gate" hidden>
<div class="gbox">
<h2 id="gt">직원 로그인</h2>
<div class="hint" id="gm"></div>
<label id="gli">아이디<input id="gi" autocomplete="username"></label>
<label id="glp">비밀번호<input id="gp" type="password" autocomplete="current-password"></label>
<label id="gcw" hidden>비밀번호 확인<input id="gp2" type="password" autocomplete="new-password"></label>
<div class="gerr" id="ge" role="alert"></div>
<div class="acts"><button type="button" id="gx" hidden>취소</button><button type="button" class="pri" id="gb">로그인</button></div>
</div>
</div>
<div id="toast" role="status"></div>

const PAT={oere:/^oe\/re$/,part:/^파트번호$/,mat:/^mat\.?$|mat\.?number/,brand:/브랜드|^brand$/,name:/^부품명$|^profile$/,dim:/^사이즈$|dimension|^규격$/,type:/rft\/std|^구분$/,ws:/^w\/s$/,oe:/oemarking/,price:/부가세|vat|price|딜러가/,orig:/원래장착/,series:/modelseries/,qty:/수량|재고|^qty$|stock/};
const REQ={part:"파트번호",brand:"브랜드",dim:"사이즈",price:"부가세 포함 (VAT포함)"};
function mapHead(row){const m={};row.forEach((c,i)=>{const n=String(c==null?"":c).toLowerCase().replace(/\s+/g,"");if(!n)return;for(const k in PAT){if(!(k in m)&&PAT[k].test(n)){m[k]=i;break}}});return m}
let pending=null;
async function parse(f){
 const rep=$("#rep");pending=null;$("#apply").disabled=true;$("#mode").hidden=true;
 rep.textContent="파일을 읽는 중입니다…";
 let aoa;
 try{const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:"",raw:true})}
 catch(e){rep.innerHTML=`<span class="bad">파일을 읽을 수 없습니다.</span> .xlsx, .xls, .csv 파일인지 확인해 주세요.`;return}
 let hi=-1,map={},best=0;
 for(let i=0;i<Math.min(10,aoa.length);i++){const m=mapHead(aoa[i]);const n=Object.keys(m).length;if(n>best){best=n;hi=i;map=m}}
 const miss=Object.keys(REQ).filter(k=>!(k in map));
 if(hi<0||miss.length){rep.innerHTML=`<span class="bad">필수 열을 찾지 못했습니다:</span> ${miss.map(k=>REQ[k]).join(", ")||"머리글 행"}<br>머리글 이름을 확인하고 다시 올려 주세요.`;return}
 const rows=[],errs=[];let blank=0,warn=0;const seen=new Map();
 const cell=(r,k)=>{if(!(k in map))return"";let v=r[map[k]];v=v==null?"":String(v).trim();return v==="#N/A"?"":v};
 for(let i=hi+1;i<aoa.length;i++){
  const r=aoa[i];if(r.every(c=>String(c).trim()==="")){blank++;continue}
  const part=cell(r,"part"),price=Number(String(cell(r,"price")).replace(/[,원\s]/g,""));
  if(!part){errs.push(`${i+1}행: 파트번호가 비어 있습니다`);continue}
  if(!isFinite(price)||cell(r,"price")===""){errs.push(`${i+1}행 (${part}): 가격이 숫자가 아닙니다`);continue}
  const o={part};["oere","mat","brand","name","dim","type","ws","oe","orig","series"].forEach(k=>o[k]=cell(r,k));
  o.price=price;o.qty=("qty" in map&&cell(r,"qty")!=="")?(isNaN(Number(cell(r,"qty")))?cell(r,"qty"):Number(cell(r,"qty"))):"";
  if(!specOf(o.dim))warn++;
  seen.set(part,o);rows.push(o);
 }
 const uniq=[...seen.values()],dup=rows.length-uniq.length;
 pending={rows:uniq.map(prep),name:f.name};
 rep.innerHTML=`<div><b>${f.name}</b> · 머리글 ${hi+1}행 기준</div><div class="ok">반영 가능 ${uniq.length.toLocaleString()}건</div>`
  +(errs.length?`<div class="bad">제외된 행 ${errs.length}건</div><ul>${errs.slice(0,5).map(e=>`<li>${esc(e)}</li>`).join("")}${errs.length>5?`<li>외 ${errs.length-5}건</li>`:""}</ul>`:"")
  +(dup?`<div class="hint">중복 파트번호 ${dup}건은 마지막 행만 사용합니다.</div>`:"")
  +(warn?`<div class="hint">규격 형식(예: 225/45R17)이 다른 행 ${warn}건은 규격 검색에서 빠질 수 있습니다.</div>`:"")
  +("qty" in map?`<div class="hint">수량 열을 인식했습니다. 목록에 재고 열이 표시됩니다.</div>`:`<div class="hint">수량 열이 없어 가격표로만 등록됩니다.</div>`);
 $("#mode").hidden=false;$("#apply").disabled=!uniq.length;
}
$("#up").onclick=()=>{$("#rep").textContent="";$("#mode").hidden=true;$("#apply").disabled=true;pending=null;$("#file").value="";$("#dlg").showModal()};
$("#cancel").onclick=()=>$("#dlg").close();
$("#pick").onclick=()=>$("#file").click();
$("#file").onchange=e=>e.target.files[0]&&parse(e.target.files[0]);
const dz=$("#drop");
["dragenter","dragover"].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add("on")}));
["dragleave","drop"].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove("on")}));
dz.addEventListener("drop",e=>{const f=e.dataTransfer.files[0];if(f)parse(f)});
async function saveShared(){
 const btn=$("#apply");btn.disabled=true;
 const md=document.querySelector('input[name="m"]:checked').value;
 let rows=pending.rows;
 if(md==="merge"){const m=new Map(data.map(r=>[r.part,r]));rows.forEach(r=>m.set(r.part,r));rows=[...m.values()]}
 const clean=rows.map(({h,bk,spec,...r})=>r);
 const v=Date.now().toString(36),N=150,n=Math.ceil(clean.length/N),old=cur;
 try{
  for(let i=0;i<n;i++){toast(`저장 중… (${i+1}/${n})`);await DB.doc("tires/"+v+"-"+i).set({rows:clean.slice(i*N,(i+1)*N)})}
  await DB.doc("meta/current").set({v,chunks:n,count:clean.length,name:pending.name,at:new Date().toLocaleString("ko-KR",{dateStyle:"medium",timeStyle:"short"})});
  if(old)for(let i=0;i<old.chunks;i++){try{await DB.doc("tires/"+old.v+"-"+i).delete()}catch(e){}}
  $("#dlg").close();toast(`${clean.length.toLocaleString()}건을 저장했습니다. 모든 직원에게 바로 반영됩니다.`);
 }catch(e){btn.disabled=false;toast("저장하지 못했습니다. 편집 권한을 확인하고 다시 시도해 주세요.")}
}
$("#apply").onclick=()=>{
 if(!pending)return;
 if(store==="shared")return saveShared();
 const mode=document.querySelector('input[name="m"]:checked').value;
 let rows=pending.rows;
 if(mode==="merge"){const m=new Map(data.map(r=>[r.part,r]));rows.forEach(r=>m.set(r.part,r));rows=[...m.values()]}
 data=rows;custom=true;meta={name:pending.name,at:new Date().toLocaleString("ko-KR",{dateStyle:"medium",timeStyle:"short"})};
 let saved=true;
 try{localStorage.setItem(KEY,JSON.stringify({rows:data.map(({h,...r})=>r),meta}))}catch(e){saved=false}
 S.b="";S.t="";S.open=null;S.limit=50;
 $("#dlg").close();render();
 toast(saved?`${data.length.toLocaleString()}건을 반영했습니다.`:"반영했지만 이 브라우저에 저장하지 못했습니다. 새로고침하면 기본 데이터로 돌아갑니다.");
};
$("#reset").onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}data=DEFAULT;data.forEach(prep);custom=false;meta={name:"샘플 데이터 (이전 양식 파일, 가격은 딜러가 기준)",at:""};S.b="";S.t="";render();toast("기본 데이터로 복원했습니다.")};
/* 직원 로그인 (ID/비밀번호는 해시로만 공유 저장소에 보관) */
let ok=false,AUTH=null,authLoaded=false,gmode="login",autoAsked=false;
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,"0")).join("");
function showGate(kind){
 gmode=kind;$("#gate").hidden=false;$("#ge").textContent="";["gi","gp","gp2"].forEach(i=>$("#"+i).value="");
 const none=kind==="none",setup=kind==="setup";
 $("#gt").textContent=setup?"접속 ID와 비밀번호 설정":"직원 로그인";
 $("#gm").textContent=setup?"직원들이 화면을 볼 때 입력할 ID와 비밀번호를 정해 주세요. 새로 저장하면 이전 정보는 사용할 수 없습니다.":none?"접속 정보가 아직 설정되지 않았습니다. 담당자에게 문의해 주세요.":"직원만 볼 수 있는 화면입니다. ID와 비밀번호를 입력해 주세요.";
 $("#gli").hidden=$("#glp").hidden=none;$("#gcw").hidden=!setup;$("#gx").hidden=!setup;$("#gb").hidden=none;
 $("#gb").textContent=setup?"저장":"로그인";
}
function chkSession(){try{ok=!!AUTH&&sessionStorage.getItem("tire-auth")===AUTH.hash}catch(e){ok=false}}
function sync(){
 const lock=store==="shared"&&!canUp&&!ok;
 document.body.classList.toggle("locked",lock);
 $("#auth").hidden=!(store==="shared"&&canUp);
 if(gmode==="setup")return;
 if(lock&&authLoaded)showGate(AUTH?"login":"none");else $("#gate").hidden=true;
}
async function submitGate(){
 const id=$("#gi").value.trim().toLowerCase(),pw=$("#gp").value,err=$("#ge");
 if(!window.crypto||!crypto.subtle){err.textContent="이 브라우저에서는 로그인을 사용할 수 없습니다.";return}
 if(!id||!pw){err.textContent="ID와 비밀번호를 입력해 주세요.";return}
 if(gmode==="setup"){
  if(pw.length<6){err.textContent="비밀번호는 6자 이상으로 정해 주세요.";return}
  if(pw!==$("#gp2").value){err.textContent="비밀번호 확인이 일치하지 않습니다.";return}
  try{
   const salt=[...crypto.getRandomValues(new Uint8Array(12))].map(x=>x.toString(16).padStart(2,"0")).join("");
   await DB.doc("meta/auth").set({salt,hash:await sha(salt+"|"+id+"|"+pw)});
   gmode="login";sync();toast("접속 ID와 비밀번호를 저장했습니다.");
  }catch(e){err.textContent="저장하지 못했습니다. 편집 권한을 확인해 주세요."}
  return;
 }
 if(!AUTH)return;
 const h=await sha(AUTH.salt+"|"+id+"|"+pw);
 if(h===AUTH.hash){ok=true;try{sessionStorage.setItem("tire-auth",h)}catch(e){}sync()}
 else{await new Promise(r=>setTimeout(r,800));err.textContent="ID 또는 비밀번호가 맞지 않습니다."}
}
$("#gb").onclick=submitGate;$("#gx").onclick=()=>{gmode="login";sync()};$("#auth").onclick=()=>showGate("setup");
["gi","gp","gp2"].forEach(i=>$("#"+i).addEventListener("keydown",e=>{if(e.key==="Enter")submitGate()}));
const MAYBE=!!(window.claude&&window.claude.use);
if(MAYBE){loading=true;canUp=false}else useLocal();
render();
(async()=>{
 if(!MAYBE)return;
 let db=null,U=null;
 try{db=await claude.use("db")}catch(e){}
 if(db){try{U=await claude.use("user")}catch(e){}}
 if(!db){loading=false;canUp=true;useLocal();render();return}
 store="shared";DB=db;
 try{canUp=U?!!(await U.canEdit()):false}catch(e){canUp=false}
 db.doc("meta/auth").onSnapshot(s=>{AUTH=s.exists?s.data():null;authLoaded=true;chkSession();if(canUp&&!AUTH&&!autoAsked){autoAsked=true;showGate("setup")}sync()},()=>{authLoaded=true;sync()});
 db.doc("meta/current").onSnapshot(async s=>{
  try{
   if(!s.exists){data=[];meta={name:"",at:""};cur=null}
   else{
    const m=s.data(),rows=[];
    for(let i=0;i<m.chunks;i++){const c=await db.doc("tires/"+m.v+"-"+i).get();if(!c.exists){loading=false;render();return}rows.push(...c.data().rows)}
    rows.forEach(prep);data=rows;meta={name:m.name,at:m.at};cur={v:m.v,chunks:m.chunks};
   }
  }catch(e){}
  loading=false;render();
 },()=>{loading=false;data=[];render();toast("공유 데이터를 불러오지 못했습니다. 새로고침해 주세요.")});
})();
</script>
</body>
</html>
