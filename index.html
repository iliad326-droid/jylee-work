<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이재영 업무</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f5f7;--panel:#fff;--ink:#16202a;--sub:#5b6773;--line:#d9dfe5;--acc:#0b5cab;--acc-ink:#fff;--hl:#e8f1fb;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12171c;--panel:#1b222a;--ink:#e8edf2;--sub:#97a3af;--line:#2d3742;--acc:#5aa2e8;--acc-ink:#0a1520;--hl:#1c2b3c;--bad:#f2928b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12171c;--panel:#1b222a;--ink:#e8edf2;--sub:#97a3af;--line:#2d3742;--acc:#5aa2e8;--acc-ink:#0a1520;--hl:#1c2b3c;--bad:#f2928b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 "Noto Sans KR","Malgun Gothic",sans-serif}
main{max-width:1280px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:21px;margin:0 0 12px}
h2{font-size:16px;margin:22px 0 8px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
label{display:block;font-size:13px;color:var(--sub);margin-bottom:3px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 9px}
input[type=text]{width:130px}
button{font:inherit;font-weight:500;background:var(--acc);color:var(--acc-ink);border:0;border-radius:4px;padding:9px 20px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button.sm{padding:3px 12px;font-size:13px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#msg{color:var(--sub)}#msg.err{color:var(--bad)}
.app{display:flex;gap:16px;align-items:flex-start}
nav{width:196px;flex:none;position:sticky;top:12px;display:flex;flex-direction:column;gap:4px}
nav button{background:transparent;color:var(--ink);text-align:left;padding:9px 12px;border:1px solid transparent}
nav button.on{background:var(--acc);color:var(--acc-ink)}
nav button:not(.on):not(:disabled):hover{border-color:var(--line);background:var(--panel)}
#view{flex:1;min-width:0}
#view>h2:first-child{margin-top:0}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:6px}
.kpi div{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:4px;padding:8px 12px}
.kpi b{display:block;font-size:18px}.kpi span{font-size:13px;color:var(--sub)}
.cap{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-bottom:4px}
.wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-weight:500;color:var(--sub);font-size:13px;cursor:pointer;user-select:none}
th.l,td.l{text-align:left}
.bar{display:grid;grid-template-columns:90px 1fr 190px;gap:10px;align-items:center;margin:4px 0}
.bt{background:var(--line);height:16px;border-radius:3px}.bt i{display:block;height:100%;background:var(--sub);border-radius:3px}
.bar.t .bt i{background:var(--acc)}.bv{font-size:13px;text-align:right}
.hint{color:var(--sub);font-size:13px}
@media (max-width:760px){.app{flex-direction:column}nav{width:100%;flex-direction:row;overflow-x:auto;position:static}nav button{white-space:nowrap}.bar{grid-template-columns:70px 1fr}.bv{grid-column:1/3}}
.ni{display:flex;gap:2px;align-items:stretch}.ni>button[data-tab]{flex:1}
.mv{display:flex;flex-direction:column;gap:2px}
nav button.mb{padding:0 6px;font-size:9px;line-height:1.2;flex:1;background:transparent;color:var(--sub);border:1px solid var(--line)}
nav button.mb:disabled{opacity:.3}
.chips{margin:2px 0 12px}
.chip{background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:5px 12px;margin:0 6px 6px 0;border-radius:16px}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.chip small{opacity:.75}
tr.dn td{background:#fde4e4}tr.up td{background:#e0eefc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) tr.dn td{background:#3b2326}:root:not([data-theme="light"]) tr.up td{background:#1d3149}}
:root[data-theme="dark"] tr.dn td{background:#3b2326}:root[data-theme="dark"] tr.up td{background:#1d3149}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 9px;width:100%;resize:vertical}
.post .ph{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:baseline}
.post .pb{white-space:pre-wrap;word-break:break-word;margin:6px 0 8px}
.post .pa{display:flex;gap:8px}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);padding:3px 12px;font-size:13px}
button.warn{background:var(--bad);color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.top h1{margin:0}
#gate{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);align-items:center;justify-content:center;padding:16px}
html.locked main{display:none}html.locked #gate{display:flex}
#gf{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px;width:100%;max-width:340px}
#gf h1{margin:0 0 14px}#gf input{width:100%;margin-bottom:10px}#gf button{width:100%;margin-top:4px}
#sout{width:100%;font:12px/1.5 ui-monospace,Consolas,monospace;word-break:break-all}
</style>
<script>
/* 로그인 설정: 화면 위쪽 '로그인 설정' 버튼으로 만든 한 줄로 아래 줄을 바꿔 저장하세요. 비어 있으면 로그인 없이 열립니다. */
const AUTH={salt:"",hash:""};
if(AUTH.hash)document.documentElement.classList.add("locked");
</script>
</head>
<body>
<div id="gate"><form id="gf"><h1>로그인</h1><label for="gu">아이디</label><input type="text" id="gu" autocomplete="username"><label for="gp">비밀번호</label><input type="password" id="gp" autocomplete="current-password"><button type="submit" id="gb">로그인</button><p id="gm" class="hint" role="status" style="margin:10px 0 0"></p></form></div>
<main>
<div class="top"><h1>재고 분석</h1><span><button class="ghost" id="logout" hidden>로그아웃</button> <button class="ghost" id="setupbtn">로그인 설정</button></span></div>
<div class="box" id="setupbox" hidden>
<p class="hint" style="margin:0 0 10px">아이디와 비밀번호를 정하면 이 페이지에 넣을 설정 한 줄을 만들어 줍니다. 비밀번호 자체는 어디에도 저장되지 않고, 변환된 값만 한 줄에 들어갑니다.</p>
<div class="row"><div><label for="su">아이디</label><input type="text" id="su" autocomplete="off"></div><div><label for="sp">비밀번호</label><input type="password" id="sp" autocomplete="new-password"></div><button id="smk">설정 줄 만들기</button></div>
<div id="sres" hidden style="margin-top:12px"><textarea id="sout" rows="3" readonly></textarea><div class="row" style="margin-top:8px"><button class="sm" id="scp">복사</button><span class="hint">HTML 파일을 메모장으로 열어 <b>const AUTH=</b> 로 시작하는 줄을 이 줄로 바꿔 저장한 뒤 도메인에 올리세요. 설정 후에는 아이디와 비밀번호를 모르면 열 수 없습니다.</span></div></div>
</div>
<div class="box">
<div class="row">
<div><label for="f">현재고리스트 엑셀</label><input type="file" id="f" accept=".xlsx,.xls,.csv"></div>
<div><label for="codes">집중해서 볼 ALOIS코드</label><input type="text" id="codes" value="OA, OV"></div>
<div><label for="topn">상위 라인 수</label><input type="text" id="topn" value="30" style="width:70px"></div>
<button id="go" disabled>분석 시작</button>
<span id="msg" role="status">파일을 선택해 주세요. 파일은 이 브라우저 안에서만 처리됩니다.</span>
</div>
</div>
<div class="app">
<nav id="nav"></nav>
<section id="view"><p class="hint">파일을 선택하고 분석 시작을 누르면 왼쪽 메뉴를 쓸 수 있습니다.</p></section>
</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=i=>document.getElementById(i);
const fmt=n=>Math.round(n||0).toLocaleString("ko-KR");
const pct=n=>((n||0)*100).toFixed(1)+"%";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>{if(typeof v==="number")return v;const n=parseFloat(String(v==null?"":v).replace(/,/g,""));return isNaN(n)?0:n};
const NOW=new Date();
const mon=d=>(NOW-d)/(864e5*30.44);
const ds=d=>d?d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"):"";
function dt(v){
  if(v instanceof Date)return isNaN(v)?null:v;
  if(typeof v==="number"&&v>20000)return new Date(1899,11,30+Math.floor(v));
  const m=/(\d{4})\D?(\d{2})\D?(\d{2})/.exec(String(v||""));
  return m?new Date(+m[1],+m[2]-1,+m[3]):null;
}
const F={pn:"부품번호",nm:"부품명",wh:"창고명",loc:"로케이션",code:"ALOIS코드",grp:"제품그룹",mdl:"모델코드",price:"이동평균가",po:"P/O수량",bo:"B/O수량",qty:"현재고수량",av:"가용재고",mn:"최소재고수량",mx:"최대재고수량",ls:"최종판매일자",lb:"최종구매일자",sup:"보급코드",dc:"할인코드",ucm:"비관리부품여부"};
const NUMF=["price","po","bo","qty","av","mn","mx"],DATEF=["ls","lb"];
/* 시트 범위 정보가 실제 데이터보다 작게 적힌 파일을 위해, 실제 셀 위치로 범위를 다시 잡는다 */
function fixRef(ws){
  const arr=Array.isArray(ws)?ws:(ws["!data"]||null);
  let R=0,C=0;
  if(arr){
    R=arr.length-1;
    for(let i=0;i<arr.length;i++){const r=arr[i];if(r&&r.length-1>C)C=r.length-1}
  }else{
    for(const k in ws){if(k.charCodeAt(0)===33)continue;const a=XLSX.utils.decode_cell(k);if(a.r>R)R=a.r;if(a.c>C)C=a.c}
  }
  const cur=ws["!ref"]?XLSX.utils.decode_range(ws["!ref"]):null;
  if(!cur||cur.e.r<R||cur.e.c<C)ws["!ref"]=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:R,c:C}});
}
function readRows(buf){
  const opt={type:"array",cellFormula:false,cellHTML:false,cellText:false,cellStyles:false};
  let best=[];const info=[];
  for(const dense of [true,false]){
    try{
      const wb=XLSX.read(buf,Object.assign({dense:dense},opt));
      for(const n of wb.SheetNames){
        const ws=wb.Sheets[n];if(!ws)continue;
        fixRef(ws);
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
        info.push(n+" "+rows.length+"행");
        if(rows.length>best.length)best=rows;
      }
    }catch(e){info.push("읽기 오류: "+e.message)}
    if(best.length>1)break;
  }
  return{rows:best,info:info.join(", ")};
}
function parse(buf){
  const R0=readRows(buf),rows=R0.rows;
  let h=-1;
  for(let i=0;i<Math.min(15,rows.length);i++){if(rows[i].map(c=>String(c).trim()).includes("부품번호")){h=i;break}}
  if(h<0)throw new Error("'부품번호' 헤더 행을 찾지 못했습니다. 현재고리스트 파일이 맞는지 확인하세요. (시트: "+R0.info+")");
  const hd=rows[h].map(c=>String(c).trim()),ix={};
  for(const k in F)ix[k]=hd.indexOf(F[k]);
  ["code","price","qty"].forEach(k=>{if(ix[k]<0)throw new Error("'"+F[k]+"' 컬럼이 없습니다.")});
  const out=[];
  for(let j=h+1;j<rows.length;j++){
    const r=rows[j];if(!r.some(c=>c!==""))continue;
    const o={};
    for(const k in F){const v=ix[k]<0?"":r[ix[k]];o[k]=NUMF.includes(k)?num(v):DATEF.includes(k)?dt(v):String(v).trim()}
    o.code=o.code.toUpperCase();o.amt=o.price*o.qty;out.push(o);
  }
  if(!out.length)throw new Error("헤더는 찾았지만 데이터 행을 읽지 못했습니다. (시트: "+R0.info+")");
  return out;
}

/* 표: 헤더 클릭 정렬, 표 복사 */
const TB={};
const C={pn:{k:"pn",h:"부품번호",l:1},nm:{k:"nm",h:"부품명",l:1},wh:{k:"wh",h:"창고",l:1},loc:{k:"loc",h:"로케이션",l:1},code:{k:"code",h:"코드"},qty:{k:"qty",h:"현재고",t:"n"},price:{k:"price",h:"이동평균가",t:"n"},amt:{k:"amt",h:"재고금액",t:"n"},p:{k:"p",h:"전체 대비",t:"p"},ls:{k:"ls",h:"최종판매일",t:"d"},lb:{k:"lb",h:"최종구매일",t:"d"}};
function cell(c,v){
  if(c.t==="n")return fmt(v);if(c.t==="p")return pct(v);if(c.t==="d")return ds(v);
  if(c.t==="m")return v==null?"":v.toFixed(1);if(c.t==="r")return v==null?"":pct(v);
  return esc(v);
}
function sorted(id){
  const t=TB[id];if(!t.sk)return t.rows;
  const k=t.sk,s=t.sd;
  return t.rows.slice().sort((a,b)=>{
    let x=a[k],y=b[k];
    if(x instanceof Date||y instanceof Date){x=x?+x:-1;y=y?+y:-1}
    if(typeof x==="string"||typeof y==="string")return String(x||"").localeCompare(String(y||""),"ko")*s;
    return((x||0)-(y||0))*s;
  });
}
function draw(id){
  const t=TB[id],el=$(id);if(!el)return;
  const rows=sorted(id);
  el.innerHTML='<div class="cap"><span>'+fmt(rows.length)+"행"+(rows.length>t.lim?" 중 상위 "+fmt(t.lim)+"행 표시 (복사는 전체)":"")+'</span><button class="sm" data-copy="'+id+'">표 복사</button></div><div class="wrap"><table><thead><tr>'+
  t.cols.map(c=>'<th data-k="'+c.k+'" data-id="'+id+'" class="'+(c.l?"l":"")+'">'+esc(c.h)+(t.sk===c.k?(t.sd>0?" ▲":" ▼"):"")+"</th>").join("")+
  "</tr></thead><tbody>"+rows.slice(0,t.lim).map(r=>'<tr class="'+(t.rc?t.rc(r):"")+'">'+t.cols.map(c=>'<td class="'+(c.l?"l":"")+'">'+cell(c,r[c.k])+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>";
}
function mt(id,cols,rows,lim,sk,rc){TB[id]={cols,rows,lim:lim||100,sk:sk||null,sd:-1,rc};draw(id)}
function copy(id,btn){
  const t=TB[id],rows=sorted(id);
  const raw=(c,v)=>c.t==="d"?ds(v):c.t==="p"||c.t==="r"?(v==null?"":(v*100).toFixed(1)+"%"):v==null?"":v;
  const txt=[t.cols.map(c=>c.h).join("\t")].concat(rows.map(r=>t.cols.map(c=>raw(c,r[c.k])).join("\t"))).join("\n");
  const ok=()=>{btn.textContent="복사됨";setTimeout(()=>{btn.textContent="표 복사"},1500)};
  const fb=()=>{const a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();let r=false;try{r=document.execCommand("copy")}catch(e){}a.remove();r?ok():(btn.textContent="복사 실패")};
  try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(e){fb()}
}
document.addEventListener("click",e=>{
  const th=e.target.closest("th[data-k]");
  if(th){const id=th.dataset.id,t=TB[id],k=th.dataset.k;if(t.sk===k)t.sd=-t.sd;else{t.sk=k;t.sd=-1}draw(id);return}
  const b=e.target.closest("[data-copy]");if(b)copy(b.dataset.copy,b);
});

/* 집계 도우미 */
let A=null;const S={ltm:12,gk:"code",prev:null,pa:null,pb:null,pk:"",pk2:"",ps:null,pv:"O",oePre:"O",oeSel:[]};
const kpi=a=>'<div class="kpi">'+a.map(x=>"<div><b>"+x[0]+"</b><span>"+esc(x[1])+"</span></div>").join("")+"</div>";
const GC=h=>[{k:"k",h,l:1},{k:"n",h:"라인수",t:"n"},{k:"q",h:"현재고수량",t:"n"},{k:"a",h:"재고금액",t:"n"},{k:"p",h:"전체 대비",t:"p"}];
function grpBy(key,rows){
  rows=rows||A.rows;const m={};let tot=0;
  rows.forEach(r=>{const k=r[key]||"(빈값)",g=m[k]||(m[k]={k,n:0,q:0,a:0});g.n++;g.q+=r.qty;g.a+=r.amt;tot+=r.amt});
  return Object.values(m).map(g=>({...g,p:tot?g.a/tot:0})).sort((a,b)=>b.a-a.a);
}
const need=()=>{if(!A){$("view").innerHTML='<p class="hint">먼저 파일을 선택하고 분석 시작을 눌러 주세요.</p>';return true}return false};

/* 탭 */
function vSum(){
  const by=grpBy("code"),a=A;
  const items=[[fmt(a.total)+"원","전체 재고금액 ("+fmt(a.rows.length)+"라인)"]];
  let sub=0;
  a.tg.forEach(t=>{const x=by.find(g=>g.k===t),v=x?x.a:0;sub+=v;items.push([fmt(v)+"원 · "+pct(a.total?v/a.total:0),t+" 재고금액 · 전체 대비"])});
  if(a.tg.length>1)items.push([fmt(sub)+"원 · "+pct(a.total?sub/a.total:0),a.tg.join("+")+" 합계 · 전체 대비"]);
  const lines=a.rows.filter(r=>a.tg.includes(r.code));
  $("view").innerHTML=kpi(items)+"<h2>ALOIS 구분(첫 글자 A·L·O·I·S)별 합계</h2><div id=t0></div><h2>ALOIS코드별 재고금액</h2><div id=t1></div><h2>"+esc(a.tg.join("·"))+" 재고금액 상위 "+a.top+"라인</h2><div id=t2></div>";
  mt("t0",GC("구분"),byLetter(),10);
  mt("t1",GC("ALOIS코드"),by,50,"a");
  mt("t2",[C.pn,C.nm,C.wh,C.loc,C.code,C.qty,C.price,C.amt,C.p,C.ls],lines,a.top,"amt");
}
function vAge(){

const isDateHd=n=>/(일자|날짜|일시|date)/i.test(n)||/일$/.test(n);
function dcell(v){
  if(v instanceof Date)return ds(v);
  const t=String(v==null?"":v).trim();
  if(/^\d{5}(\.\d+)?$/.test(t)){
    const n=parseFloat(t);
    if(n>20000&&n<80000){
      const d=dt(Math.floor(n)),fr=n-Math.floor(n),mi=Math.round(fr*1440);
      return ds(d)+(mi?" "+String(Math.floor(mi/60)%24).padStart(2,"0")+":"+String(mi%60).padStart(2,"0"):"");
    }
  }
  if(/^\d{8}$/.test(t))return t.slice(0,4)+"-"+t.slice(4,6)+"-"+t.slice(6,8);
  return t;
}
function parseRaw(buf){
  const R=readRows(buf),rows=R.rows;
  if(rows.length<2)throw new Error("데이터를 읽지 못했습니다. (시트: "+R.info+")");
  let h=-1;
  for(let i=0;i<Math.min(15,rows.length);i++){if(rows[i].map(c=>String(c).trim()).includes("부품번호")){h=i;break}}
  if(h<0)for(let i=0;i<Math.min(15,rows.length);i++){if(rows[i].filter(c=>String(c).trim()!=="").length>=2){h=i;break}}
  if(h<0)throw new Error("헤더 행을 찾지 못했습니다.");
  const seen={},head=rows[h].map((c,i)=>{let n=String(c).trim()||("열"+(i+1));if(seen[n]){seen[n]++;n=n+"_"+seen[n]}else seen[n]=1;return n});
  const dh=head.map(isDateHd);
  const data=rows.slice(h+1).filter(r=>r.some(c=>String(c).trim()!=="")).map(r=>{const o={};head.forEach((n,i)=>{const v=r[i];o[n]=dh[i]?dcell(v):(v==null?"":(v instanceof Date?ds(v):String(v).trim()))});return o});
  if(!data.length)throw new Error("헤더는 찾았지만 데이터 행이 없습니다. (시트: "+R.info+")");
  return{head,rows:data};
}

function runPR(){

  A.rows.forEach(r=>{const c=r.code.charAt(0),g=m[L.includes(c)?c:"기타"];g.n++;g.q+=r.qty;g.a+=r.amt});
  return Object.values(m).map(g=>({...g,p:A.total?g.a/A.total:0}));
}
function vGrp(){
  const O=[["code","ALOIS코드"],["grp","제품그룹"],["mdl","모델코드"],["wh","창고"],["loc","로케이션"]];

  $("gk").onchange=e=>{S.gk=e.target.value;vGrp()};

}

function vFind(){

  const run=()=>{

    const x=A.rows.filter(r=>(!c||r.code===c)&&(!u||r.ucm.toUpperCase()===u)&&(!q||r.pn.toLowerCase().includes(q)||r.nm.toLowerCase().includes(q)));

function vChart(){

  $("view").innerHTML='<h2>ALOIS코드별 재고금액 <span class="hint">(파란색: '+esc(A.tg.join(", "))+")</span></h2>"+bars(grpBy("code"),15)+"<h2>제품그룹별 재고금액 상위 10</h2>"+bars(grpBy("grp"),10)+"<h2>창고별 재고금액</h2>"+bars(grpBy("wh"),10);
}
/* 게시판: db capability. 글은 작성자별 문서 board/<id> 안에 보관 (남의 글은 수정 불가, 소유자는 삭제 가능) */
const BD={db:null,user:null,uid:null,owner:false,docs:new Map(),err:"",gen:0,loaded:false};
const bdTime=t=>{const d=new Date(t);return isNaN(d)?"":ds(d)+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const bdErr=e=>{const c=e&&e.code;return c==="quota_exceeded"?"저장 공간이 가득 찼습니다. 오래된 글을 삭제해 주세요.":c==="invalid_argument"?"이 계정은 게시판에 글을 쓸 권한이 없습니다. (공유 설정에서 '기여자' 이상이어야 합니다)":c==="resource_exhausted"?"요청이 너무 빠릅니다. 잠시 후 다시 시도해 주세요.":"저장하지 못했습니다: "+((e&&e.message)||e)};
async function initBoard(){
  try{
    if(!(window.claude&&claude.use)){BD.loaded=true;return}
    const r=await Promise.all([claude.use("db"),claude.use("user")]);
    BD.db=r[0];BD.user=r[1];
    if(BD.user){BD.uid=await BD.user.id();BD.owner=await BD.user.isOwner()}
    BD.loaded=true;
    if(BD.db)BD.db.collection("board").onSnapshot(snap=>{
      BD.docs=new Map(snap.docs.map(d=>[d.id,d.data()||{}]));drawBoard();
    },e=>{BD.err="게시판을 불러오지 못했습니다 ("+((e&&e.code)||"오류")+")";drawBoard()});
    if(curTab==="board")vBoard();
  }catch(e){BD.loaded=true;BD.err="게시판을 사용할 수 없습니다: "+((e&&e.message)||e);if(curTab==="board")vBoard()}
}
async function bdWrite(author,fn){
  const ref=BD.db.doc("board/"+author),snap=await ref.get();
  const cur=(snap.exists&&snap.data()&&snap.data().posts)||[];
  await ref.set({posts:fn(cur.slice())});
}
function vBoard(){
  const can=!!(BD.db&&BD.uid);
  const note=!BD.loaded?"게시판을 불러오는 중입니다...":BD.err?BD.err:!BD.db?"이 화면에서는 게시판을 쓸 수 없습니다. claude.ai에서 로그인한 상태로 페이지를 열어 주세요.":!BD.uid?"로그인 정보를 확인하지 못해 글을 쓸 수 없습니다. 읽기만 가능합니다.":"";
  $("view").innerHTML='<div class="box">'+(can?'<label for="bt">제목</label><input type="text" id="bt" maxlength="100" style="width:100%" value="'+esc(S.bdT||"")+'"><label for="bb" style="margin-top:8px">내용</label><textarea id="bb" rows="5" maxlength="5000">'+esc(S.bdB||"")+'</textarea><div class="row" style="margin-top:8px"><button id="bpost">글 올리기</button><span id="bmsg" class="hint"></span></div>':"")+(note?'<p class="hint" style="margin:0">'+esc(note)+"</p>":"")+'<p class="hint" style="margin:8px 0 0">회사 기밀이나 개인정보는 올리지 마세요. 글은 claude.ai의 이 페이지에 저장되며, 페이지를 공유한 사람에게만 보입니다.</p></div><div id="bl"></div>';
  if(can){
    $("bt").oninput=e=>{S.bdT=e.target.value};$("bb").oninput=e=>{S.bdB=e.target.value};
    $("bpost").onclick=async()=>{
      const t=(S.bdT||"").trim(),b=(S.bdB||"").trim(),m=$("bmsg");
      if(!t&&!b){m.textContent="제목이나 내용을 입력해 주세요.";return}
      $("bpost").disabled=true;m.textContent="저장 중...";
      try{
        const p={id:"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:t||"(제목 없음)",b,at:Date.now()};
        await bdWrite(BD.uid,l=>[p].concat(l).slice(0,200));
        S.bdT="";S.bdB="";vBoard();
      }catch(e){m.textContent=bdErr(e);$("bpost").disabled=false}
    };
  }
  drawBoard();
}
async function drawBoard(){
  const el=$("bl");if(!el)return;
  const g=++BD.gen,posts=[];
  BD.docs.forEach((d,id)=>(d.posts||[]).forEach(p=>posts.push(Object.assign({},p,{a:id}))));
  posts.sort((x,y)=>(y.at||0)-(x.at||0));
  let names={};
  if(BD.user&&posts.length){try{names=await BD.user.profiles(Array.from(new Set(posts.map(p=>p.a))))}catch(e){}}
  const el2=$("bl");if(g!==BD.gen||!el2)return;
  if(!posts.length){el2.innerHTML='<p class="hint">'+(BD.db?"아직 올라온 글이 없습니다.":"")+"</p>";return}
  const shown=posts.slice(0,50);
  el2.innerHTML=(posts.length>shown.length?'<p class="hint">최근 '+shown.length+"개만 표시합니다. (전체 "+fmt(posts.length)+"개)</p>":"")+shown.map(p=>{
    const mine=BD.uid&&p.a===BD.uid,who=mine?"나":((names[p.a]&&names[p.a].name)||"작성자"),editing=S.bdEdit===p.id;
    const acts=(mine||BD.owner)?'<div class="pa">'+(mine?'<button class="ghost" data-bd="edit" data-a="'+esc(p.a)+'" data-p="'+esc(p.id)+'">'+(editing?"취소":"수정")+"</button>":"")+(S.bdDel===p.id?'<button class="warn sm" data-bd="del2" data-a="'+esc(p.a)+'" data-p="'+esc(p.id)+'">정말 삭제</button>':'<button class="ghost" data-bd="del" data-a="'+esc(p.a)+'" data-p="'+esc(p.id)+'">삭제</button>')+"</div>":"";
    const body=editing?'<input type="text" id="et" maxlength="100" style="width:100%" value="'+esc(S.bdET!=null?S.bdET:p.t)+'"><textarea id="eb" rows="5" maxlength="5000" style="margin-top:6px">'+esc(S.bdEB!=null?S.bdEB:p.b)+'</textarea><div style="margin-top:6px"><button class="sm" data-bd="save" data-a="'+esc(p.a)+'" data-p="'+esc(p.id)+'">저장</button> <span id="emsg" class="hint"></span></div>':'<div class="pb">'+esc(p.b)+"</div>";
    return '<div class="box post"><div class="ph"><b>'+esc(p.t)+'</b><span class="hint">'+esc(who)+" · "+esc(bdTime(p.at))+(p.ed?" (수정됨)":"")+"</span></div>"+body+acts+"</div>";
  }).join("");
  const et=$("et"),eb=$("eb");
  if(et)et.oninput=e=>{S.bdET=e.target.value};if(eb)eb.oninput=e=>{S.bdEB=e.target.value};
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("button[data-bd]");if(!b||!BD.db)return;
  const a=b.dataset.a,id=b.dataset.p,k=b.dataset.bd;
  if(k==="edit"){if(S.bdEdit===id){S.bdEdit=null;S.bdET=S.bdEB=null}else{S.bdEdit=id;S.bdET=S.bdEB=null}S.bdDel=null;drawBoard();return}
  if(k==="del"){S.bdDel=id;drawBoard();return}
  try{
    if(k==="del2"){await bdWrite(a,l=>l.filter(p=>p.id!==id));S.bdDel=null}
    if(k==="save"){
      const t=(S.bdET!=null?S.bdET:$("et").value).trim(),bd=(S.bdEB!=null?S.bdEB:$("eb").value).trim();
      if(!t&&!bd){$("emsg").textContent="제목이나 내용을 입력해 주세요.";return}
      await bdWrite(a,l=>l.map(p=>p.id===id?Object.assign({},p,{t:t||"(제목 없음)",b:bd,ed:1}):p));
      S.bdEdit=null;S.bdET=S.bdEB=null;
    }
    drawBoard();
  }catch(x){const m=$("emsg")||$("bmsg");if(m)m.textContent=bdErr(x)}
});
const TABS=[["sum","요약",vSum],["oe","OE 파트",vOE],["pr","PR 파트 비교",vPR,1],["age","장기재고",vAge],["lim","재고 과부족",vLim],["cmp","전 파일 비교",vCmp],["grp","그룹별 집계",vGrp],["bop","B/O·P/O",vBop],["find","검색·정렬",vFind],["chart","차트",vChart],["board","게시판",vBoard,1]];
let ready=false,curTab="",order=[];
try{order=JSON.parse(localStorage.getItem("tabOrder")||"[]")}catch(e){}
function renderNav(){
  const ids=TABS.map(t=>t[0]);
  order=order.filter(i=>ids.includes(i));ids.forEach(i=>{if(!order.includes(i))order.push(i)});
  $("nav").innerHTML=order.map((id,i)=>{
    const t=TABS.find(x=>x[0]===id),off=!(ready||t[3]);
    return '<div class="ni"><button data-tab="'+id+'"'+(id===curTab?' class="on"':"")+(off?" disabled":"")+">"+t[1]+'</button><span class="mv"><button class="mb" data-mv="-1" data-id="'+id+'" aria-label="위로 이동"'+(i===0?" disabled":"")+'>▲</button><button class="mb" data-mv="1" data-id="'+id+'" aria-label="아래로 이동"'+(i===order.length-1?" disabled":"")+">▼</button></span></div>";
  }).join("");
}
function openTab(id){
  curTab=id;renderNav();
  const t=TABS.find(x=>x[0]===id);
  if(!t[3]&&need())return;
  try{t[2]()}catch(e){$("view").innerHTML='<p class="hint" style="color:var(--bad)">표시하지 못했습니다: '+esc(e.message)+"</p>"}
}
$("nav").addEventListener("click",e=>{
  const m=e.target.closest("button[data-mv]");
  if(m){
    const i=order.indexOf(m.dataset.id),j=i+(+m.dataset.mv);
    if(i>-1&&j>=0&&j<order.length){[order[i],order[j]]=[order[j],order[i]];try{localStorage.setItem("tabOrder",JSON.stringify(order))}catch(x){}renderNav()}
    return;
  }
  const b=e.target.closest("button[data-tab]");if(b&&!b.disabled)openTab(b.dataset.tab);
});
renderNav();
initBoard();

/* 로그인 (브라우저 안에서만 확인하는 간단한 잠금) */
const enc=new TextEncoder(),hex=b=>Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
async function kdf(u,p,salt){
  if(!(window.crypto&&crypto.subtle))throw new Error("이 주소에서는 로그인을 확인할 수 없습니다. https 주소로 열어 주세요.");
  const k=await crypto.subtle.importKey("raw",enc.encode(u+"\n"+p),"PBKDF2",false,["deriveBits"]);
  return hex(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:enc.encode(salt),iterations:150000},k,256));
}
(function(){
  const unlock=()=>document.documentElement.classList.remove("locked");
  if(AUTH.hash){
    $("logout").hidden=false;
    try{if(sessionStorage.getItem("authHash")===AUTH.hash)unlock()}catch(e){}
    let fail=0,lockedUntil=0;
    $("gf").addEventListener("submit",async e=>{
      e.preventDefault();const m=$("gm");
      if(Date.now()<lockedUntil){m.textContent="잠시 후 다시 시도해 주세요. ("+Math.ceil((lockedUntil-Date.now())/1000)+"초)";return}
      $("gb").disabled=true;m.textContent="확인 중...";
      try{
        const h=await kdf($("gu").value.trim(),$("gp").value,AUTH.salt);
        if(h===AUTH.hash){try{sessionStorage.setItem("authHash",h)}catch(x){}$("gp").value="";m.textContent="";unlock();return}
        fail++;m.textContent="아이디 또는 비밀번호가 맞지 않습니다.";
        if(fail>=5){fail=0;lockedUntil=Date.now()+30000;m.textContent="여러 번 틀렸습니다. 30초 후 다시 시도해 주세요."}
      }catch(x){m.textContent=x.message}
      $("gb").disabled=false;
    });
    $("logout").onclick=()=>{try{sessionStorage.removeItem("authHash")}catch(e){}location.reload()};
  }
  $("setupbtn").onclick=()=>{const b=$("setupbox");b.hidden=!b.hidden};
  $("smk").onclick=async()=>{
    const u=$("su").value.trim(),p=$("sp").value;
    if(!u||p.length<6){alert("아이디를 입력하고 비밀번호는 6자 이상으로 정해 주세요.");return}
    try{
      const salt=hex(crypto.getRandomValues(new Uint8Array(16)));
      $("sout").value='const AUTH={salt:"'+salt+'",hash:"'+await kdf(u,p,salt)+'"};';
      $("sres").hidden=false;$("sp").value="";
    }catch(x){alert(x.message)}
  };
  $("scp").onclick=()=>{const t=$("sout");t.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}$("scp").textContent=ok?"복사됨":"선택됨 (Ctrl+C)";setTimeout(()=>{$("scp").textContent="복사"},1500)};
})();

/* 파일 선택 / 분석 시작 */
let buf=null,fname="";
const say=(t,err)=>{$("msg").textContent=t;$("msg").className=err?"err":""};
window.addEventListener("error",e=>say("오류가 발생했습니다: "+e.message,true));
window.addEventListener("unhandledrejection",e=>say("오류가 발생했습니다: "+(e.reason&&e.reason.message||e.reason),true));
$("f").addEventListener("change",e=>{
  const f=e.target.files[0];$("go").disabled=true;if(!f){say("파일을 선택해 주세요.");return}
  const r=new FileReader();
  r.onload=()=>{buf=r.result;fname=f.name;$("go").disabled=false;say(f.name+" 선택됨")};
  r.onerror=()=>say("파일을 읽지 못했습니다. 다시 선택해 주세요.",true);
  r.readAsArrayBuffer(f);
});
$("go").addEventListener("click",()=>{
  if(typeof XLSX==="undefined"){say("엑셀을 읽는 구성요소를 불러오지 못했습니다. 인터넷 연결이나 회사 네트워크의 차단 여부를 확인해 주세요.",true);return}
  say("파일을 읽고 분석하는 중입니다. 파일이 크면 수십 초 걸릴 수 있습니다...");
  setTimeout(()=>{
    try{
      const rows=parse(buf);
      const tg=$("codes").value.split(/[,\s]+/).map(s=>s.trim().toUpperCase()).filter(Boolean);
      const top=Math.max(1,parseInt($("topn").value,10)||30);
      const total=rows.reduce((s,r)=>s+r.amt,0);
      rows.forEach(r=>r.p=total?r.amt/total:0);
      A={name:fname,rows,total,tg,top};
      ready=true;renderNav();
      say(fname+" · "+fmt(rows.length)+"라인 분석 완료");
      openTab("sum");
    }catch(x){say("분석하지 못했습니다: "+x.message,true)}
  },30);
});
